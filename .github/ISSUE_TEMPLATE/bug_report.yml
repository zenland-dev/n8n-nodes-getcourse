name: Bug report
description: Something in the node behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: The n8n version and the version of this package.
      placeholder: "n8n 2.3.1, n8n-nodes-getcourse 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Which node
      options:
        - GetCourse (Tech API)
        - GetCourse Legacy (Import/Export API)
        - GetCourse Trigger
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Resource and operation
      placeholder: "Order → Get"
    validations:
      required: true

  - type: textarea
    id: response
    attributes:
      label: What GetCourse answered
      description: >
        GetCourse likes to reply 200 OK with success: false, so paste the body, not only
        the status code. Remove the developer key, the school key, the account secret key
        and personal data first — issues here are public.
      render: json

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        For an export: the export id and whether it ever left the processing state.
        For the trigger: the source — a GetCourse process or a Tech API subscription —
        and one sample payload with the personal data removed.
